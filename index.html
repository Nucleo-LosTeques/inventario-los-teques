<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Instrumento - El Sistema</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; padding: 15px; margin: 0; color: #1e293b; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 400px; margin: 20px auto; }
    .header { border-bottom: 2px solid #0284c7; padding-bottom: 10px; margin-bottom: 15px; }
    .header h2 { margin: 0; color: #0284c7; font-size: 18px; text-transform: uppercase; }
    .header p { margin: 3px 0 0 0; font-size: 12px; color: #64748b; font-weight: bold; }
    .field { margin-bottom: 12px; display: flex; flex-direction: column; }
    .label { font-size: 11px; text-transform: uppercase; font-weight: 800; color: #64748b; }
    .value { font-size: 14px; font-weight: 600; color: #0f172a; margin-top: 2px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; text-align: center; }
    .badge-operativo { background: #dcfce7; color: #15803d; }
    .badge-danado { background: #fee2e2; color: #b91c1c; }
    #cargando { text-align: center; padding: 20px; font-weight: bold; color: #0284c7; }
  </style>
</head>
<body>
  <div class="card">
    <div id="cargando">🔄 Cargando ficha de instrumento...</div>
    <div id="contenido" style="display:none;"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbychWWUgWolsNpNMMWlf2UZrjmr7IqANiRfa5-Hg2B760d7x8JDs8yJT3ULVsd2yEY0/exec";
    
    const urlParams = new URLSearchParams(window.location.search);
    const inv = urlParams.get('inv') || urlParams.get('INV');

    if (!inv) {
      document.getElementById('cargando').innerHTML = '❌ No se especificó el número de inventario.';
    } else {
      fetch(`${API_URL}?inv=${encodeURIComponent(inv)}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('cargando').style.display = 'none';
          const cont = document.getElementById('contenido');
          cont.style.display = 'block';

          if (data.success) {
            const esDanado = /DANAD|INOPERATIV|REPARAC/i.test(data.condicion);
            cont.innerHTML = `
              <div class="header"><h2>🎻 Ficha de Instrumento</h2><p>EL SISTEMA - NÚCLEO LOS TEQUES</p></div>
              <div class="field"><span class="label">N° Inventario</span><span class="value" style="font-size:16px; color:#0284c7;">${data.inv}</span></div>
              <div class="field"><span class="label">Instrumento</span><span class="value">${data.instrumento}</span></div>
              <div class="field"><span class="label">Marca / Modelo / Medida</span><span class="value">${data.marca}</span></div>
              <div class="field"><span class="label">Serial</span><span class="value">${data.serial}</span></div>
              <div class="field"><span class="label">Condición</span><div><span class="badge ${esDanado ? 'badge-danado' : 'badge-operativo'}">${data.condicion}</span></div></div>
              <div class="field"><span class="label">Ubicación Actual</span><span class="value">${data.ubicacion}</span></div>
              <div class="field"><span class="label">Asignado A</span><span class="value">${data.asignado}</span></div>
              <div class="field"><span class="label">Observaciones</span><span class="value">${data.observaciones}</span></div>
            `;
          } else {
            cont.innerHTML = `
              <div class="header" style="border-color:#ef4444;"><h2 style="color:#ef4444;">❌ Instrumento No Encontrado</h2></div>
              <p>No se encontró ningún registro para el inventario <b>${inv}</b>.</p>
            `;
          }
        })
        .catch(err => {
          document.getElementById('cargando').innerHTML = '❌ Error al consultar los datos.';
        });
    }
  </script>
</body>
</html>
